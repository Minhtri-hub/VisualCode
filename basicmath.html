<html>
    <head>
        <title>Math_NQmt</title>
    </head>
    <script>
        function update_result()
        {
            a = myform.a_coeff.value
            b = myform.b_coeff.value
            op = myform.op_math.value

            if (!isNaN(a) && !isNaN(b))
            {
                a = parseFloat(a)
                b = parseFloat(b)
                result2 = document.getElementById("result2")

                if (op == "add") {
                    myform.result1.value = (a + " + " + b + " = " + (a + b))
                }
                else if (op == "minus") {
                    myform.result1.value = (a + " - " + b + " = " + (a - b))
                }
                else if (op == "multi") {
                    myform.result1.value = (a + " * " + b + " = " + (a * b))
                }
                else if (op == "div") {
                    if (b != 0)
                        myform.result1.value = (a + " : " + b + " = " + (a / b))
                    else
                        myform.result1.value = "Không thể chia cho 0!"
                }

                // Gán nội dung của result1 vào ô td (sửa cú pháp sai)
                result2.innerHTML = myform.result1.value
            }
            else {
                myform.result1.value = "Vui lòng nhập số hợp lệ!"
                document.getElementById("result2").innerHTML = ""
            }
        }
    </script>
    <body>
        <form name="myform">
            <table border="1" cellpadding="5">
                <tr>
                    <td>A Coeff.</td>
                    <td>
                        <input type="text" name="a_coeff" id="a_coeff" oninput="update_result()"/>
                    </td>
                </tr>
                <tr>
                    <td>Operators:</td>
                    <td>
                        <input type="radio" name="op_math" id="op_add" value="add" oninput="update_result()"/>
                        <label for="op_add">Add</label>
                        <input type="radio" name="op_math" id="op_minus" value="minus" oninput="update_result()"/>
                        <label for="op_minus">Minus</label>
                        <input type="radio" name="op_math" id="op_multi" value="multi" oninput="update_result()"/>
                        <label for="op_multi">Multi</label>
                        <input type="radio" name="op_math" id="op_div" value="div" oninput="update_result()"/>
                        <label for="op_div">Div</label>
                    </td>
                </tr>
                <tr>
                    <td>B Coeff.</td>
                    <td>
                        <input type="text" name="b_coeff" id="b_coeff" oninput="update_result()"/>
                    </td>
                </tr>
                <tr>
                    <td>Result 1:</td>
                    <td>
                        <input type="text" name="result1" id="result1"/>
                    </td>
                </tr>
                <tr>
                    <td>Result 2:</td>
                    <td id="result2"></td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <button type="reset" onclick="document.getElementById('result2').innerHTML=''">Clean</button>
                        <button type="button" onclick="alert('Nhập giá trị và chọn phép tính!')">Help page</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
