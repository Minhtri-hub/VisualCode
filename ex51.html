<html>
<head>
    <title>Ex51_NguyenQuachMinhTri</title>
    <style>
        body {
            background-color: #3F7274; /* xanh nền form */
            font-family: Arial, sans-serif;
            color: white;
        }

        .header {
            font-size: x-large;
            text-align: center;
            padding: 10px;
            color: gold;
            font-weight: bold;
            border-bottom: 3px solid orange;
        }

        .header span {
            display: block;
            color: #F9B53C;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #DFF2F0;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        form {
            width: 600px;
            margin: 0 auto;
            background-color: #3F7274;
        }

        table {
            width: 100%;
            color: white;
            font-size: 14px;
        }

        td {
            padding: 5px;
        }

        input[type="text"], input[type="date"], select {
            width: 90%;
            padding: 4px;
            border: none;
            border-radius: 3px;
        }

        select[multiple] {
            height: 70px;
            width: 95%;
        }

        input[type="submit"], input[type="reset"] {
            padding: 5px 15px;
            margin: 10px 5px;
            background-color: #D8D8D8;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover, input[type="reset"]:hover {
            background-color: #BFBFBF;
        }
    </style>

    <script>
        function showAlert(event) {
            event.preventDefault();
            alert("Registration submitted successfully!");
        }
    </script>
</head>

<body>
    <div class="header">
        St. Mary's of Northland Pines
        <span>Research Hospital and Clinics</span>
    </div>

    <h2>Newborn Registration</h2>

    <form onsubmit="showAlert(event)">
        <table>
            <tr>
                <td>Date:</td>
                <td><input type="date" name="date"/></td>
            </tr>
            <tr>
                <td>1) Infant's first name:</td>
                <td><input type="text" name="infant_first"/></td>
                <td>Last:</td>
                <td><input type="text" name="infant_last"/></td>
            </tr>
            <tr>
                <td>2) Medical Record #:</td>
                <td><input type="text" name="record_number"/></td>
            </tr>
            <tr>
                <td>3) Date of birth:</td>
                <td><input type="date" name="dob"/></td>
            </tr>
            <tr>
                <td>4) Birth weight:</td>
                <td><input type="text" name="weight"/></td>
            </tr>
            <tr>
                <td>5) APGAR score:</td>
                <td><input type="text" name="apgar"/></td>
            </tr>
            <tr>
                <td>6) Mother's first name:</td>
                <td><input type="text" name="mother_first"/></td>
                <td>Last:</td>
                <td><input type="text" name="mother_last"/></td>
            </tr>
            <tr>
                <td>7) Father's first name:</td>
                <td><input type="text" name="father_first"/></td>
                <td>Last:</td>
                <td><input type="text" name="father_last"/></td>
            </tr>
            <tr>
                <td>8) Physician (check all that apply):</td>
                <td colspan="3">
                    <select name="physician" multiple>
                        <option>Dr. Warren Albert</option>
                        <option>Dr. Maria Alvarez</option>
                        <option>Dr. Karen Brinkman</option>
                        <option>Dr. Michael Kerry</option>
                    </select>
                </td>
            </tr>
            <tr align="center">
                <td colspan="4">
                    <input type="submit" value="Register"/>
                    <input type="reset" value="Cancel"/>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
