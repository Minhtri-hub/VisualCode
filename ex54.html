<html>
    <head>
        <title>ex54-NQMT</title>
    </head>
    <body>
        <table border="1">
            <tr>
                <td>a:</td>
                <td>
                    <input type="text" id="a" >
                </td>
            </tr>
            <tr>
                <td>b:</td>
                <td>
                    <input type="text" id="b" >
                </td>
            </tr>
            <tr>
                <td>c:</td>
                <td>
                    <input type="text" id="c" >
                </td>
            </tr>
            <tr>
                <td>Result:</td>
                <td>
                    <input type="text" id="result" >
                </td>
            </tr>
        </table>
        <button onclick="max()">Max</button>
        <button onclick="min()">Min</button>
        <button onclick="sin()">Sin(a)</button>
        <button onclick="cos()">Cos(a)</button>
        <button onclick="ab()">a^b</button>

        <script>
            function max(){
                var a=parseFloat(document.getElementById("a").value);
                var b=parseFloat(document.getElementById("b").value);
                var c=parseFloat(document.getElementById("c").value);
                document.getElementById("result").value=Math.max(a,b,c);
            }
            function min(){
                var a=parseFloat(document.getElementById("a").value);
                var b=parseFloat(document.getElementById("b").value);
                var c=parseFloat(document.getElementById("c").value);
                document.getElementById("result").value=Math.min(a,b,c);
            }
            function sin(){
                var a=parseFloat(document.getElementById("a").value);
                document.getElementById("result").value=Math.sin(a);
            }
            function cos(){
                var a=parseFloat(document.getElementById("a").value);
                document.getElementById("result").value=Math.cos(a);
            }
            function ab(){
                var a=parseFloat(document.getElementById("a").value);
                var b=parseFloat(document.getElementById("b").value);
                document.getElementById("result").value=Math.pow(a,b);
            }
        </script>
    </body>
</html>
