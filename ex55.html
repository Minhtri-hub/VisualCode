<html>
    <head>
        <title>Ex55-NQMT</title>
    </head>
    <body>
        <caption  style="background-color: lavender;">The Quadratic Equation</caption>
        <table border="1">
            <tr>
                <td>a:</td>
                <td><input type="text" id="a"></td>
            </tr>
            <tr>
                <td>b:</td>
                <td><input type="text" id="b"></td>
            </tr>
            <tr>
                <td>c:</td>
                <td><input type="text" id="c"></td>
            </tr>
            <tr>
                <td>Result:</td>
                <td><input type="text" id="result" readonly></td>
            </tr>
        </table>

        <button onclick="solve()">Solution</button>
        <button type="reset" onclick="clearFields()">Clear</button>

        <script>
            function solve() {
                var a = parseFloat(document.getElementById("a").value);
                var b = parseFloat(document.getElementById("b").value);
                var c = parseFloat(document.getElementById("c").value);
                var result = document.getElementById("result");

                if (isNaN(a) || isNaN(b) || isNaN(c)) {
                    result.value = "Vui lòng nhập đầy đủ a, b, c";
                    return;
                }

                if (a === 0) {
                    if (b === 0) {
                        result.value = c === 0 ? "Vô số nghiệm" : "Vô nghiệm";
                    } else {
                        result.value = "Nghiệm x = " + (-c / b);
                    }
                } else {
                    var delta = b * b - 4 * a * c;
                    if (delta < 0) {
                        result.value = "Vô nghiệm thực";
                    } else if (delta === 0) {
                        var x = -b / (2 * a);
                        result.value = "Nghiệm kép x = " + x;
                    } else {
                        var x1 = (-b + Math.sqrt(delta)) / (2 * a);
                        var x2 = (-b - Math.sqrt(delta)) / (2 * a);
                        result.value = "x₁ = " + x1 + ", x₂ = " + x2;
                    }
                }
            }

            function clearFields() {
                document.getElementById("a").value = "";
                document.getElementById("b").value = "";
                document.getElementById("c").value = "";
                document.getElementById("result").value = "";
            }
        </script>
    </body>
</html>
